[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phystensor"
version = "0.1.0"
authors = [
  { name="Kazi Saad Asif", email="kazisaadasif29@gmail.com" },
]
description = "A century-proof SI-vector physics engine for industrial inference."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/ksaad20/phystensor"
"Bug Tracker" = "https://github.com/ksaad20/phystensor/issues"
Company = "https://xylema.com.bd"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phystensor = ["py.typed"]

# --- Linter Configuration (Ruff) ---
# pyproject.toml
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "UP", "N", "D", "W", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- Testing Configuration (Pytest) ---
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]

- name: Install package
  run: |
    python -m pip install --upgrade pip
    pip install -e ".[test]"

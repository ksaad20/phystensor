[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phystensor"
version = "0.1.0"
authors = [
    {name = "Kazi Saad Asif", email = "kazisaadasif29@gmail.com"},
]
description = "A strictly-typed physical tensor library for deterministic scientific computing."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.26.4,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.1.0",
    "build>=1.2.0,<2.0.0",
    "twine>=5.1.0,<6.0.0",
]

[project.urls]
Homepage = "https://github.com/ksaad20/phystensor"
"Bug Tracker" = "https://github.com/ksaad20/phystensor/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phystensor = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "UP", "N", "D", "W", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
